<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة وإدارة الطلاب</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ccc; border-radius: 8px; }
        .form-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .list-item { background: #fdfdfd; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        #qrcode { margin-top: 15px; display: inline-block; }
        .qr-area { text-align: center; margin-top: 20px; padding: 15px; background: #f0f8ff; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="text-decoration:none;">⬅ عودة</a>
    <h3 style="text-align:center;">إضافة طالب جديد</h3>
    
    <div style="background: #f1f3f4; padding: 15px; border-radius: 10px;">
        <label>اسم الطالب الكامل:</label>
        <input type="text" id="addName" placeholder="أدخل اسم الطالب">

        <label>المرحلة:</label>
        <select id="addClass">
            <option value="الرابع">الرابع</option>
            <option value="الخامس">الخامس</option>
            <option value="السادس">السادس</option>
        </select>

        <label>الشعبة:</label>
        <select id="addSection">
            <option value="أ">أ</option><option value="ب">ب</option><option value="ج">ج</option>
            <option value="د">د</option><option value="هـ">هـ</option><option value="و">و</option><option value="ز">ز</option>
        </select>

        <label>صورة الطالب:</label>
        <input type="file" id="addPhotoFile" accept="image/*">

        <button class="form-submit" onclick="saveStudent()">حفظ الطالب وإنشاء الباركود</button>
    </div>

    <div id="qrArea" class="qr-area">
        <h4>باركود الطالب المضاف:</h4>
        <div id="qrcode"></div>
    </div>

    <h4 style="margin-top:30px;">قائمة الطلاب:</h4>
    <div id="studentsList"></div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadStudents() {
        db.collection("students").get().then(snap => {
            const list = document.getElementById('studentsList');
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div class="list-item"><strong>${d.fullName}</strong> - ${d.className} ${d.section}</div>`;
            });
        });
    }

    async function saveStudent() {
        const name = document.getElementById('addName').value;
        const cls = document.getElementById('addClass').value;
        const sec = document.getElementById('addSection').value;
        const file = document.getElementById('addPhotoFile').files[0];
        
        let photoURL = "";
        if (file) {
            const canvas = document.createElement('canvas');
            const img = new Image();
            img.src = await new Promise(r => { const fr = new FileReader(); fr.onload = (e) => r(e.target.result); fr.readAsDataURL(file); });
            canvas.width = 200; canvas.height = 200;
            canvas.getContext('2d').drawImage(img, 0, 0, 200, 200);
            photoURL = canvas.toDataURL('image/jpeg', 0.5);
        }

        const studentData = { fullName: name, className: cls, section: sec, photoURL: photoURL };
        const docRef = await db.collection("students").add(studentData);
        
        // إنشاء الباركود يحتوي على كامل البيانات
        document.getElementById('qrArea').style.display = "block";
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), {
            text: JSON.stringify({id: docRef.id, ...studentData}),
            width: 150, height: 150
        });

        alert("تم الحفظ!");
        loadStudents();
    }

    loadStudents();
</script>
</body>
</html>
