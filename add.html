<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وإضافة الطلاب - اختبار مباشر</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; background: #fff; }
        .form-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #statusBox { background: #e9ecef; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #333; text-align: center; }
        .list-item { background: #fdfdfd; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">إدارة وإضافة الطلاب (وضع التشخيص)</h3>
    
    <div id="statusBox">جاري الاتصال بـ Firebase...</div>

    <div style="background: #f1f3f4; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <label>الرقم الامتحاني (ID):</label>
        <input type="text" id="addID" placeholder="مثال: 1001">

        <label>اسم الطالب الكامل:</label>
        <input type="text" id="addName" placeholder="أدخل اسم الطالب">

        <label>المرحلة الدراسية:</label>
        <select id="addClass">
            <option value="">-- اختر المرحلة --</option>
            <option value="الرابع العلمي">الرابع العلمي</option>
            <option value="الخامس العلمي">الخامس العلمي</option>
            <option value="السادس العلمي">السادس العلمي</option>
            <option value="الرابع الأدبي">الرابع الأدبي</option>
            <option value="الخامس الأدبي">الخامس الأدبي</option>
            <option value="السادس الأدبي">السادس الأدبي</option>
        </select>

        <label>الشعبة:</label>
        <select id="addSection">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">أ</option>
            <option value="ب">ب</option>
            <option value="ج">ج</option>
            <option value="و">و</option>
            <option value="ز">ز</option>
        </select>

        <button class="form-submit" onclick="saveData()">حفظ البيانات تجريبياً</button>
    </div>

    <h4 style="text-align:right;">قائمة الطلاب المسجلين:</h4>
    <div id="studentsList">
        <p style="text-align:center;">جاري جلب البيانات...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    const statusBox = document.getElementById('statusBox');
    let db;

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        statusBox.innerHTML = "✅ متصل بقاعدة البيانات بنجاح";
        statusBox.style.color = "green";
        loadStudents();
    } catch (error) {
        statusBox.innerHTML = "❌ خطأ في الاتصال: " + error.message;
        statusBox.style.color = "red";
    }

    async function loadStudents() {
        const listDiv = document.getElementById('studentsList');
        try {
            const querySnapshot = await getDocs(collection(db, "students"));
            listDiv.innerHTML = "";
            
            if (querySnapshot.empty) {
                listDiv.innerHTML = "<p style='text-align:center; color:#666;'>لا توجد بيانات مسجلة حالياً في القاعدة.</p>";
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                listDiv.innerHTML += `
                    <div class="list-item">
                        <div>
                            <strong>${data.fullName}</strong><br>
                            <small>${data.className || ''} - شعبة ${data.section || ''}</small>
                        </div>
                        <small style="color: blue; font-weight: bold;">ID: ${docSnap.id}</small>
                    </div>
                `;
            });
        } catch (err) {
            listDiv.innerHTML = `<p style='text-align:center; color:red;'>خطأ في القراءة: ${err.message}</p>`;
        }
    }

    window.saveData = async function() {
        const id = document.getElementById('addID').value.trim();
        const fullName = document.getElementById('addName').value.trim();
        const className = document.getElementById('addClass').value;
        const section = document.getElementById('addSection').value;

        if (!id || !fullName) {
            alert("الرجاء إدخال الرقم الامتحاني واسم الطالب!");
            return;
        }

        statusBox.innerHTML = "⏳ جاري إرسال البيانات إلى Firebase...";
        
        try {
            await setDoc(doc(db, "students", id), {
                fullName: fullName,
                className: className,
                section: section,
                photoURL: ""
            });
            
            statusBox.innerHTML = "✅ تمت العملية وحفظ الطالب بنجاح!";
            statusBox.style.color = "green";
            alert("تم الحفظ بنجاح!");
            
            document.getElementById('addID').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addClass').value = '';
            document.getElementById('addSection').value = '';
            
            loadStudents();
        } catch (err) {
            statusBox.innerHTML = "❌ خطأ عند الحفظ: " + err.message;
            statusBox.style.color = "red";
            alert("خطأ في الحفظ: " + err.message);
        }
    };
</script>

</body>
</html>
