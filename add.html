<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وإضافة الطلاب</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- مكتبة توليد الباركود QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .nav-btns { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .back-btn, .cards-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block; }
        .cards-btn { background: #17a2b8; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; background: #fff; }
        .form-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #statusBox { background: #e9ecef; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #333; text-align: center; font-weight: bold; }
        .list-item { background: #fdfdfd; padding: 12px; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .student-info { display: flex; align-items: center; }
        .student-thumb { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-left: 12px; border: 1px solid #ddd; }
        .actions-group button { padding: 6px 10px; margin-right: 5px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        
        /* صندوق معاينة الباركود للطالب الأخير */
        #qrPreviewBox { margin-top: 20px; padding: 15px; background: #e8f4fd; border: 1px dashed #007bff; border-radius: 10px; text-align: center; display: none; }
        #qrcode { display: inline-block; margin-top: 10px; background: white; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-btns">
        <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
        <a href="cards.html" class="cards-btn">🪪 عرض جميع بطاقات الطلاب للطباعة</a>
    </div>

    <h3 style="text-align:center;">إدارة وإضافة الطلاب</h3>
    
    <div id="statusBox">✅ متصل بقاعدة البيانات بنجاح</div>

    <div style="background: #f1f3f4; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <label>الرقم الامتحاني (ID):</label>
        <input type="text" id="addID" placeholder="مثال: 1001">

        <label>اسم الطالب الكامل:</label>
        <input type="text" id="addName" placeholder="أدخل اسم الطالب">

        <label>المرحلة الدراسية:</label>
        <select id="addClass">
            <option value="">-- اختر المرحلة --</option>
            <option value="الرابع العلمي">الرابع العلمي</option>
            <option value="الخامس العلمي">الخامس العلمي</option>
            <option value="السادس العلمي">السادس العلمي</option>
            <option value="الرابع الأدبي">الرابع الأدبي</option>
            <option value="الخامس الأدبي">الخامس الأدبي</option>
            <option value="السادس الأدبي">السادس الأدبي</option>
        </select>

        <label>الشعبة:</label>
        <select id="addSection">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">أ</option>
            <option value="ب">ب</option>
            <option value="ج">ج</option>
            <option value="د">د</option>
            <option value="هـ">هـ</option>
            <option value="و">و</option>
            <option value="ز">ز</option>
        </select>

        <label>صورة الطالب (اختر من الآيباد):</label>
        <input type="file" id="addPhotoFile" accept="image/*" style="background:#fff;">

        <button class="form-submit" onclick="saveStudent()">حفظ وإضافة الطالب</button>
    </div>

    <!-- معاينة باركود الطالب الذي تم حفظه للتو -->
    <div id="qrPreviewBox">
        <h4 style="margin: 0 0 10px 0; color: #007bff;">🪪 باركود الطالب المضاف:</h4>
        <div id="qrcode"></div>
        <p id="qrStudentName" style="margin: 8px 0 0 0; font-weight: bold; color: #333;"></p>
    </div>

    <h4 style="text-align:right; margin-top: 25px;">قائمة الطلاب المسجلين:</h4>
    <div id="studentsList">
        <p style="text-align:center;">جاري جلب السجلات...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const statusBox = document.getElementById('statusBox');

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    function loadStudents() {
        const listDiv = document.getElementById('studentsList');
        db.collection("students").get().then((querySnapshot) => {
            listDiv.innerHTML = "";
            if (querySnapshot.empty) {
                listDiv.innerHTML = "<p style='text-align:center; color:#666;'>لا توجد بيانات مسجلة حالياً.</p>";
                return;
            }
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const photoHtml = data.photoURL ? `<img src="${data.photoURL}" class="student-thumb">` : `<div style="width:45px;height:45px;background:#ddd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;margin-left:12px;color:#555;">بدون</div>`;
                
                listDiv.innerHTML += `
                    <div class="list-item">
                        <div class="student-info">
                            ${photoHtml}
                            <div>
                                <strong>${data.fullName}</strong><br>
                                <small style="color:#666;">${data.className || ''} - شعبة ${data.section || ''} | <span style="color:blue;">ID: ${doc.id}</span></small>
                            </div>
                        </div>
                        <div class="actions-group">
                            <button class="btn-edit" onclick="editStudent('${doc.id}', '${data.fullName}', '${data.className || ''}', '${data.section || ''}')">تعديل</button>
                            <button class="btn-delete" onclick="deleteStudent('${doc.id}')">حذف</button>
                        </div>
                    </div>
                `;
            });
        }).catch((error) => {
            listDiv.innerHTML = "<p style='text-align:center; color:red;'>خطأ في القراءة: " + error.message + "</p>";
        });
    }

    window.saveStudent = async function() {
        const id = document.getElementById('addID').value.trim();
        const fullName = document.getElementById('addName').value.trim();
        const className = document.getElementById('addClass').value;
        const section = document.getElementById('addSection').value;
        const fileInput = document.getElementById('addPhotoFile');

        if (!id || !fullName) {
            alert("الرجاء إدخال الرقم الامتحاني واسم الطالب على الأقل!");
            return;
        }

        statusBox.innerHTML = "⏳ جاري ضغط الصورة والحفظ...";
        
        let studentData = {
            fullName: fullName,
            className: className,
            section: section
        };

        if (fileInput.files.length > 0) {
            try {
                studentData.photoURL = await compressImage(fileInput.files[0]);
            } catch(e) {
                console.log("خطأ في معالجة الصورة");
            }
        }

        db.collection("students").doc(id).set(studentData, { merge: true }).then(() => {
            statusBox.innerHTML = "✅ تم حفظ الطالب وصورته بنجاح!";
            statusBox.style.color = "green";
            alert("تم الحفظ بنجاح!");
            
            // توليد وعرض الباركود للطالب الذي تم حفظه مباشرة في الصفحة
            document.getElementById('qrPreviewBox').style.display = "block";
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById('qrcode'), {
                text: id,
                width: 140,
                height: 140
            });
            document.getElementById('qrStudentName').innerText = `${fullName} (ID: ${id})`;

            // تصفير الحقول
            document.getElementById('addID').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addClass').value = '';
            document.getElementById('addSection').value = '';
            fileInput.value = '';
            
            loadStudents();
        }).catch((error) => {
            statusBox.innerHTML = "❌ خطأ في الحفظ: " + error.message;
            statusBox.style.color = "red";
            alert("فشل الحفظ: " + error.message);
        });
    };

    window.deleteStudent = function(id) {
        if (confirm("هل أنت متأكد من حذف الطالب ذو الرقم الامتحاني: " + id + "؟")) {
            db.collection("students").doc(id).delete().then(() => {
                alert("تم حذف الطالب بنجاح.");
                loadStudents();
            }).catch((error) => {
                alert("خطأ أثناء الحذف: " + error.message);
            });
        }
    };

    window.editStudent = function(id, name, cls, sec) {
        document.getElementById('addID').value = id;
        document.getElementById('addName').value = name;
        document.getElementById('addClass').value = cls;
        document.getElementById('addSection').value = sec;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        alert("تم جلب بيانات الطالب للأعلى. قم بتعديلها ثم اضغط 'حفظ وإضافة الطالب' لتحديثها.");
    };

    loadStudents();
</script>

</body>
</html>
