<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة طالب جديد</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; background: #fff; }
        .form-submit { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        #statusBox { background: #e9ecef; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; color: #333; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">إضافة طالب جديد</h3>
    
    <div id="statusBox">✅ النظام جاهز</div>

    <div style="background: #f1f3f4; padding: 15px; border-radius: 10px;">
        <label>اسم الطالب الكامل:</label>
        <input type="text" id="addName" placeholder="أدخل اسم الطالب">

        <label>المرحلة الدراسية:</label>
        <select id="addClass">
            <option value="">-- اختر المرحلة --</option>
            <option value="الرابع العلمي">الرابع العلمي</option>
            <option value="الخامس العلمي">الخامس العلمي</option>
            <option value="السادس العلمي">السادس العلمي</option>
            <option value="الرابع الأدبي">الرابع الأدبي</option>
            <option value="الخامس الأدبي">الخامس الأدبي</option>
            <option value="السادس الأدبي">السادس الأدبي</option>
        </select>

        <label>الشعبة:</label>
        <select id="addSection">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">أ</option>
            <option value="ب">ب</option>
            <option value="ج">ج</option>
            <option value="د">د</option>
            <option value="و">و</option>
        </select>

        <label>صورة الطالب:</label>
        <input type="file" id="addPhotoFile" accept="image/*" style="background:#fff;">

        <button class="form-submit" onclick="saveStudent()">حفظ وإضافة الطالب</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300; canvas.height = 300;
                    canvas.getContext('2d').drawImage(img, 0, 0, 300, 300);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    window.saveStudent = async function() {
        const fullName = document.getElementById('addName').value.trim();
        const className = document.getElementById('addClass').value;
        const section = document.getElementById('addSection').value;
        const fileInput = document.getElementById('addPhotoFile');

        if (!fullName) { alert("أدخل اسم الطالب!"); return; }

        // إنشاء ID فريد بناءً على الوقت الحالي
        const newID = "STU" + Date.now().toString().slice(-6);

        let studentData = {
            fullName: fullName,
            className: className,
            section: section,
            createdAt: new Date()
        };

        if (fileInput.files.length > 0) {
            studentData.photoURL = await compressImage(fileInput.files[0]);
        }

        db.collection("students").doc(newID).set(studentData).then(() => {
            alert("تم حفظ الطالب بنجاح! \nالرقم التعريفي (ID): " + newID);
            location.reload();
        }).catch((err) => { alert("خطأ: " + err.message); });
    };
</script>
</body>
</html>
