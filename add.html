<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة وإضافة الطلاب</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; background: #fff; }
        .form-submit { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .list-item { background: #fdfdfd; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .student-thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-left: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">إدارة وإضافة الطلاب</h3>
    
    <div style="background: #f1f3f4; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <label>الرقم الامتحاني (ID):</label>
        <input type="text" id="addID" placeholder="مثال: 1001">

        <label>اسم الطالب الكامل:</label>
        <input type="text" id="addName" placeholder="أدخل اسم الطالب">

        <label>المرحلة الدراسية:</label>
        <select id="addClass">
            <option value="">-- اختر المرحلة --</option>
            <option value="الرابع العلمي">الرابع العلمي</option>
            <option value="الخامس العلمي">الخامس العلمي</option>
            <option value="السادس العلمي">السادس العلمي</option>
            <option value="الرابع الأدبي">الرابع الأدبي</option>
            <option value="الخامس الأدبي">الخامس الأدبي</option>
            <option value="السادس الأدبي">السادس الأدبي</option>
        </select>

        <label>الشعبة:</label>
        <select id="addSection">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">أ</option>
            <option value="ب">ب</option>
            <option value="ج">ج</option>
            <option value="د">د</option>
            <option value="هاء">هاء</option>
            <option value="و">و</option>
            <option value="ز">ز</option>
        </select>

        <label>صورة الطالب (اختر من الآيباد):</label>
        <input type="file" id="addPhotoFile" accept="image/*" style="background:#fff;">

        <button class="form-submit" onclick="addNewStudentFromUI()">حفظ وإضافة الطالب</button>
    </div>

    <h4 style="text-align:right;">الطلاب المسجلون حالياً:</h4>
    <div id="studentsList">
        <p style="text-align:center;">جاري جلب السجلات...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, doc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    function getBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function loadStudentsList() {
        const listDiv = document.getElementById('studentsList');
        try {
            const querySnapshot = await getDocs(collection(db, "students"));
            listDiv.innerHTML = "";
            
            if(querySnapshot.empty) {
                listDiv.innerHTML = "<p style='text-align:center; color:#666;'>لا يوجد طلاب مسجلين حالياً.</p>";
                return;
            }

            querySnapshot.forEach((d) => {
                const data = d.data();
                const photoHtml = data.photoURL ? `<img src="${data.photoURL}" class="student-thumb">` : `<div style="width:40px;height:40px;background:#ddd;border-radius:50%;display:inline-block;text-align:center;line-height:40px;font-size:10px;">بدون</div>`;
                
                listDiv.innerHTML += `
                    <div class="list-item">
                        <div style="display:flex; align-items:center;">
                            ${photoHtml}
                            <div style="margin-right:10px;">
                                <strong>${data.fullName}</strong><br>
                                <small style="color: #666;">${data.className || ''} - شعبة ${data.section || ''}</small>
                            </div>
                        </div>
                        <small style="color: #007bff; font-weight:bold;">ID: ${d.id}</small>
                    </div>
                `;
            });
        } catch(err) {
            console.error(err);
            listDiv.innerHTML = "<p style='text-align:center; color:red;'>خطأ في القراءة من قاعدة البيانات. تحقق من قواعد الأمان (Rules).</p>";
        }
    }

    window.addNewStudentFromUI = async function() {
        const id = document.getElementById('addID').value.trim();
        const fullName = document.getElementById('addName').value.trim();
        const className = document.getElementById('addClass').value;
        const section = document.getElementById('addSection').value;
        const fileInput = document.getElementById('addPhotoFile');

        if(!id || !fullName) {
            alert("الرجاء إدخال الرقم الامتحاني واسم الطالب على الأقل");
            return;
        }

        let photoURL = "";
        if(fileInput.files.length > 0) {
            try {
                photoURL = await getBase64(fileInput.files[0]);
            } catch(e) {
                console.log("خطأ في قراءة الصورة");
            }
        }

        try {
            // حفظ البيانات في مجموعة students داخل Firebase
            await setDoc(doc(db, "students", id), { 
                fullName: fullName, 
                className: className, 
                section: section, 
                photoURL: photoURL 
            });
            
            alert("تم حفظ الطالب بنجاح في النظام!");
            
            // تفريغ الحقول بعد الحفظ الناجح
            document.getElementById('addID').value = '';
            document.getElementById('addName').value = '';
            document.getElementById('addClass').value = '';
            document.getElementById('addSection').value = '';
            fileInput.value = '';
            
            // تحديث القائمة فوراً
            loadStudentsList();
        } catch(err) {
            alert("فشل الحفظ: " + err.message);
        }
    };

    loadStudentsList();
</script>

</body>
</html>
