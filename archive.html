<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة أرشيف المحذوفات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        .form-submit { width: 100%; padding: 12px; background: #6f42c1; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .list-item { background: #fdfdfd; padding: 10px; margin-bottom: 8px; border: 1px solid #eee; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">إدارة أرشيف المحذوفات</h3>
    <button class="form-submit" onclick="loadTrashList()" style="margin-bottom:15px;">تحديث وعرض المحذوفين</button>
    <div id="trashContainer">
        <p style="text-align:center;">جاري تحميل الأرشيف...</p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    window.loadTrashList = async function() {
        const container = document.getElementById('trashContainer');
        container.innerHTML = "<p style='text-align:center;'>جاري التحميل...</p>";
        const snap = await getDocs(collection(db, "trash"));
        container.innerHTML = "";
        
        if(snap.empty) {
            container.innerHTML = "<p style='text-align:center;'>الأرشيف فارغ تماماً.</p>";
            return;
        }

        snap.forEach(d => {
            const data = d.data();
            container.innerHTML += `
                <div class="list-item">
                    <span>${data.fullName} (${d.id})</span>
                    <button class="back-btn" style="background:#28a745; margin:0; padding:5px 10px;" onclick="restoreStudent('${d.id}')">استرجاع</button>
                </div>
            `;
        });
    };

    window.restoreStudent = async function(id) {
        const ref = doc(db, "trash", id);
        const snap = await getDoc(ref);
        if(snap.exists()) {
            await setDoc(doc(db, "students", id), snap.data());
            await deleteDoc(ref);
            alert("تم استرجاع الطالب بنجاح!");
            loadTrashList();
        }
    };

    loadTrashList();
</script>

</body>
</html>
