<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إدارة الطلاب المتقدم</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; text-align: center; padding: 10px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; }
        .nav-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 20px; }
        .nav-buttons button { padding: 10px; border: none; border-radius: 5px; cursor: pointer; background: #ddd; }
        .nav-buttons button.active { background: #007bff; color: white; }
        .page { display: none; }
        .page.active { display: block; }
        input, button.btn-action { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn-action { background: #28a745; color: white; cursor: pointer; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-buttons">
        <button id="btn1" class="active" onclick="showPage('scan')">ماسح</button>
        <button id="btn2" onclick="showPage('add')">إضافة</button>
        <button id="btn3" onclick="showPage('delete')">حذف</button>
        <button id="btn4" onclick="showPage('tools')">أدوات</button>
    </div>

    <!-- 1. صفحة الماسح -->
    <div id="scan" class="page active">
        <div id="reader" style="width: 100%;"></div>
    </div>

    <!-- 2. صفحة الإضافة -->
    <div id="add" class="page">
        <input type="text" id="id" placeholder="الرقم الامتحاني">
        <input type="text" id="name" placeholder="اسم الطالب">
        <button class="btn-action" onclick="saveStudent()">حفظ الطالب</button>
    </div>

    <!-- 3. صفحة الحذف -->
    <div id="delete" class="page">
        <input type="text" id="delID" placeholder="أدخل رقم الطالب للحذف">
        <button class="btn-action btn-danger" onclick="moveToTrash()">نقل إلى المحذوفات</button>
    </div>

    <!-- 4. صفحة الأدوات -->
    <div id="tools" class="page">
        <button class="btn-action" onclick="exportData()">تصدير البيانات (JSON)</button>
        <button class="btn-action" onclick="restoreDeleted()">استرجاع المحذوفات</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase.firestore.js";

    const db = getFirestore(initializeApp({ /* ضع إعدادات Firebase هنا كما في الكود السابق */ }));

    window.showPage = (page) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
        document.getElementById(page).classList.add('active');
        document.getElementById('btn' + (page=='scan'?1:page=='add'?2:page=='delete'?3:4)).classList.add('active');
    };

    // وظيفة الحذف (النقل للمحذوفات)
    window.moveToTrash = async () => {
        const id = document.getElementById('delID').value;
        const docRef = doc(db, "students", id);
        const snap = await getDoc(docRef);
        if(snap.exists()){
            await setDoc(doc(db, "trash", id), snap.data());
            await deleteDoc(docRef);
            alert("تم النقل للمحذوفات");
        } else { alert("الطالب غير موجود"); }
    };

    // وظيفة الاسترجاع
    window.restoreDeleted = async () => {
        const snap = await getDocs(collection(db, "trash"));
        snap.forEach(async (d) => {
            await setDoc(doc(db, "students", d.id), d.data());
            await deleteDoc(doc(db, "trash", d.id));
        });
        alert("تم استرجاع جميع المحذوفات");
    };

    // تصدير البيانات
    window.exportData = async () => {
        const snap = await getDocs(collection(db, "students"));
        let data = [];
        snap.forEach(d => data.push({id: d.id, ...d.data()}));
        console.log(JSON.stringify(data));
        alert("تم نسخ البيانات للـ Console، تحقق منه");
    };
    
    // (أضف دالة الحفظ saveStudent بنفس منطق الكود السابق)
</script>
</body>
</html>
