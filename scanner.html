<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مسح وفحص الطلاب</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; }
        .search-btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #000; }
        
        #resultCard {
            margin-top: 25px;
            background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
            padding: 30px 20px;
            border-radius: 20px;
            display: none;
            text-align: center;
            border: 3px solid #007bff;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.15);
        }

        .student-big-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #28a745;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        #resName { margin: 10px 0 15px 0; color: #1a1a1a; font-size: 28px; font-weight: bold; }

        .badges-wrapper { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .info-badge { background: #e9ecef; color: #333; padding: 8px 16px; border-radius: 30px; font-size: 16px; font-weight: bold; border: 1px solid #ced4da; }

        .success-box { background: #28a745; color: white; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">ماسح وقارئ بطاقات الطلاب</h3>

    <div style="background: #fff; padding: 10px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px;">
        <label style="font-weight:bold; display:block; margin-bottom:5px;">كاميرا المسح المباشر (QR Code):</label>
        <div id="reader"></div>
    </div>

    <div style="background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 10px;">
        <label>أو أدخل الرقم الامتحاني يدوياً:</label>
        <input type="text" id="scanID" placeholder="أدخل الـ ID هنا">
        <button class="search-btn" onclick="findStudent(document.getElementById('scanID').value.trim())">بحث يدوي</button>
    </div>

    <div id="resultCard">
        <img id="resPhoto" class="student-big-img" src="" alt="صورة الطالب">
        <h1 id="resName"></h1>
        
        <div class="badges-wrapper">
            <div id="resClass" class="info-badge"></div>
            <div id="resSection" class="info-badge"></div>
        </div>

        <div class="success-box">✅ تم التحقق من الطالب بنجاح</div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function findStudent(id) {
        if (!id) return;
        const resultCard = document.getElementById('resultCard');

        db.collection("students").doc(id).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('resName').innerText = data.fullName;
                document.getElementById('resClass').innerText = data.className || 'غير محدد';
                document.getElementById('resSection').innerText = "شعبة " + (data.section || '-');
                
                const photoImg = document.getElementById('resPhoto');
                if (data.photoURL) {
                    photoImg.src = data.photoURL;
                    photoImg.style.display = "inline-block";
                } else {
                    photoImg.style.display = "none";
                }

                resultCard.style.display = "block";
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                alert("لم يتم العثور على طالب بهذا الرقم.");
            }
        }).catch((error) => {
            alert("خطأ: " + error.message);
        });
    }

    function onScanSuccess(decodedText) {
        document.getElementById('scanID').value = decodedText;
        findStudent(decodedText);
    }

    // إطار مسح كبير ومستطيل (عرض 450 وارتفاع 250) لالتقاط الباركود فوراً
    let html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { 
            fps: 10, 
            qrbox: { width: 450, height: 250 } 
        },
        onScanSuccess
    ).catch(err => {
        console.log("تعذر تشغيل الكاميرا.");
    });
</script>

</body>
</html>
