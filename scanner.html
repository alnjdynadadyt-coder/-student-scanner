<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مسح وفحص الطلاب</title>
    
    <!-- مكتبات Firebase الشاملة -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- مكتبة قراءة الباركود والـ QR عبر كاميرا الآيباد -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; }
        .search-btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; margin-bottom: 15px; background: #000; }
        
        #resultCard { margin-top: 20px; background: #f1f3f4; padding: 25px; border-radius: 14px; display: none; text-align: center; border: 2px solid #007bff; }
        /* تكبير وتوضيح صورة الطالب بشكل بارز جداً */
        .student-big-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 4px solid #28a745; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .success-box { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">ماسح وقارئ بطاقات الطلاب</h3>

    <!-- تشغيل الكاميرا المباشر لقراءة الـ QR -->
    <div style="background: #fff; padding: 10px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 15px;">
        <label style="font-weight:bold; display:block; margin-bottom:5px;">كاميرا المسح المباشر (QR Code):</label>
        <div id="reader"></div>
    </div>

    <!-- خيار البحث اليدوي الاحتياطي -->
    <div style="background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 10px;">
        <label>أو أدخل الرقم الامتحاني يدوياً:</label>
        <input type="text" id="scanID" placeholder="مثال: 01 أو 1001">
        <button class="search-btn" onclick="findStudent(document.getElementById('scanID').value.trim())">بحث يدوي</button>
    </div>

    <!-- كارت عرض بيانات الطالب والصورة الكبيرة -->
    <div id="resultCard">
        <img id="resPhoto" class="student-big-img" src="" alt="صورة الطالب">
        <h1 id="resName" style="margin: 10px 0; color: #222;"></h1>
        <p id="resDetails" style="color: #555; font-size: 18px; font-weight: bold;"></p>
        <div class="success-box">✅ تم التحقق من الطالب بنجاح</div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // دالة البحث وجلب بيانات الطالب من قاعدة البيانات
    function findStudent(id) {
        if (!id) return;
        
        const resultCard = document.getElementById('resultCard');

        db.collection("students").doc(id).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('resName').innerText = data.fullName;
                document.getElementById('resDetails').innerText = `المرحلة: ${data.className || 'غير محدد'} | الشعبة: ${data.section || 'غير محدد'} | ID: ${doc.id}`;
                
                const photoImg = document.getElementById('resPhoto');
                if (data.photoURL) {
                    photoImg.src = data.photoURL;
                    photoImg.style.display = "inline-block";
                } else {
                    photoImg.style.display = "none";
                }

                resultCard.style.display = "block";
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            } else {
                alert("لم يتم العثور على طالب يحمل الرقم: " + id);
            }
        }).catch((error) => {
            alert("خطأ في الاتصال: " + error.message);
        });
    }

    // تفعيل كاميرا الآيباد لمسح الـ QR تلقائياً
    function onScanSuccess(decodedText) {
        document.getElementById('scanID').value = decodedText;
        findStudent(decodedText);
    }

    let html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
    ).catch(err => {
        console.log("تعذر تشغيل الكاميرا تلقائياً، يمكنك استخدام البحث اليدوي.");
    });
</script>

</body>
</html>
