<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة مسح وفحص الطلاب</title>
    
    <!-- مكتبات Firebase الشاملة ومتوافق مع الآيباد -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: Tahoma, sans-serif; background: #f8f9fa; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: right; }
        .back-btn { background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; font-size: 14px; text-decoration: none; display: inline-block; }
        input { width: 100%; padding: 12px; margin: 8px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; text-align: right; }
        .search-btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        
        #resultCard { margin-top: 20px; background: #f1f3f4; padding: 20px; border-radius: 12px; display: none; text-align: center; }
        .student-big-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #007bff; margin-bottom: 10px; }
        .success-box { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-btn">⬅ عودة للرئيسية</a>
    <h3 style="text-align:center;">نظام مسح وفحص الطلاب</h3>

    <div style="background: #fff; padding: 15px; border: 1px solid #eee; border-radius: 10px;">
        <label>أدخل أو مسح الرقم الامتحاني (ID):</label>
        <input type="text" id="scanID" placeholder="مثال: 01 أو 02">
        <button class="search-btn" onclick="findStudent()">بحث عن الطالب</button>
    </div>

    <!-- كارت عرض نتيجة البحث والطالب -->
    <div id="resultCard">
        <img id="resPhoto" class="student-big-img" src="" alt="صورة الطالب">
        <h2 id="resName" style="margin: 5px 0; color: #333;"></h2>
        <p id="resDetails" style="color: #666; font-size: 16px;"></p>
        <div class="success-box">✅ تم التعرف على الطالب بنجاح في النظام</div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyBiakUsaKfRXNzM2MPekhcMAfqZibyH8lg",
      authDomain: "studentscannersystem.firebaseapp.com",
      projectId: "studentscannersystem",
      storageBucket: "studentscannersystem.firebasestorage.app",
      messagingSenderId: "639227810648",
      appId: "1:639227810648:web:a586a171027b9689b08b2d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    window.findStudent = function() {
        const id = document.getElementById('scanID').value.trim();
        const resultCard = document.getElementById('resultCard');

        if (!id) {
            alert("الرجاء إدخال أو مسح الرقم الامتحاني!");
            return;
        }

        db.collection("students").doc(id).get().then((doc) => {
            if (doc.exists) {
                const data = doc.data();
                document.getElementById('resName').innerText = data.fullName;
                document.getElementById('resDetails').innerText = `المرحلة: ${data.className || 'غيرحدد'} | الشعبة: ${data.section || 'غيرحدد'} | ID: ${doc.id}`;
                
                const photoImg = document.getElementById('resPhoto');
                if (data.photoURL) {
                    photoImg.src = data.photoURL;
                    photoImg.style.display = "inline-block";
                } else {
                    photoImg.style.display = "none";
                }

                resultCard.style.display = "block";
            } else {
                resultCard.style.display = "none";
                alert("لم يتم العثور على طالب بهذا الرقم في قاعدة البيانات!");
            }
        }).catch((error) => {
            alert("حدث خطأ في البحث: " + error.message);
        });
    };
</script>

</body>
</html>
